name: test

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

jobs:
  test:
    runs-on: '${{ matrix.os }}'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        java-version: [ 8, 11, 17, 21 ]
        python-version: [ '3.9', '3.10', '3.11', '3.12', '3.13' ]
        exclude:
          - os: macos-latest
            java-version: 8

    name: Python ${{ matrix.python-version }}, Java ${{ matrix.java-version }}, ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java 8 JDK for build
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Install dependencies
        run: |
          pip install -r py4j-python/requirements-test.txt
          cd py4j-java
          # Useful in case the build stops working because of version issues.
          ./gradlew --version
          echo `java -version` && echo `javac -version` && echo `python --version`
          echo $PATH
          echo $JAVA_HOME
          ./gradlew clean
        shell: bash

      - name: Run Gradle tests (3 attempts on transient CDN failures)
        # Maven Central / Gradle wrapper downloads occasionally fail on
        # fresh CI runners with empty caches. Build genuinely-failing
        # tests will fail the same way on each retry, just slower; the
        # backoff (20s, 40s) prevents thundering-herd against an
        # already-troubled CDN. Real test failures still report
        # cleanly via the last attempt's exit code.
        #
        # shell: bash is REQUIRED — on windows-latest the default shell
        # is PowerShell, which does not understand bash's for/do/done
        # loop syntax. shell: bash uses Git Bash on Windows runners
        # (preinstalled) for cross-platform consistency.
        shell: bash
        run: |
          cd py4j-java
          for attempt in 1 2 3; do
            echo "::group::Gradle attempt $attempt/3"
            if ./gradlew check && ./gradlew assemble; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ $attempt -lt 3 ]; then
              backoff=$((attempt * 20))
              echo "Gradle build failed (attempt $attempt/3); retrying in ${backoff}s"
              sleep "$backoff"
            fi
          done
          exit 1

      - name: Setup Java ${{ matrix.java-version }} JDK for PyTest
        if: ${{ matrix.java-version != '8' }}
        uses: actions/setup-java@v5
        with:
          java-version: '${{ matrix.java-version }}'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Run PyTest
        run: |
          cd py4j-python
          echo `java -version`
          echo $JAVA_HOME
          # Java TLS tests are disabled until they can be fixed (refs #441).
          # The perf-framework self-tests run in their own single-cell
          # workflow (.github/workflows/perf-framework.yml) — no value
          # exercising them on every Python x Java x OS combination.
          pytest -k "not java_tls_test. and not test_perf_framework" -vvv

  test-doc:
    name: Documentation build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master branch
        uses: actions/checkout@v6

      - name: Install Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: |
          python3 -m pip install -r py4j-web/requirements-doc.txt
          python3 -m pip list

      - name: Setup Java 8 JDK
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Javadoc build
        run: |
          cd py4j-java && ./gradlew javadoc && cd ..
          mv py4j-java/build/docs/javadoc py4j-web/_static/

      - name: Sphinx build
        run: |
          cd py4j-web && make clean html && cd ..
          mv py4j-web/_build/html ../ # Move out of the current repo for GitHub Pages.

      # Publishing documentation only for commits in the master branch.
      - name: Checkout GitHub Pages branch
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: gh-pages

      - name: Copy the generated site
        if: github.event_name != 'pull_request'
        run: |
          # Include Javadoc if the commit is tagged (for releases only).
          if [ -z "`git describe --tags --exact-match 2>/dev/null`" ]; then
            rm -fr ../html/_static/javadoc
            [ -d _static/javadoc ]  && mv _static/javadoc ../html/_static
          fi

          rm -fr * # Remove existing site
          touch .nojekyll # See https://github.blog/2009-12-29-bypassing-jekyll-on-github-pages
          echo "www.py4j.org" > CNAME # Custom domain for GitHub Actions
          cp -r ../html/* . # Move generated site to the current repo.

      - name: Push new site
        uses: EndBug/add-and-commit@v8
        if: github.event_name != 'pull_request'
        with:
          default_author: github_actions
          message: Push new site by ${{ github.sha }}
          add: "*"
          push: "--force" # In case it conflicts with the same step in another workflow.
